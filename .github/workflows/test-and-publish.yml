# Cluster-independent CI for yoga-sutras (backend + frontend).
#
# Mirrors the ramayanam test-and-publish flow: runs pytest on the backend,
# builds multi-arch backend + frontend images, pushes to GHCR, and opens a
# PR on naren-m/homelab bumping both kustomization newTags.
#
# Why: the in-cluster Argo CI pipeline depends on github-ssh-key and
# registry-config secrets in the argo namespace that were lost in the
# 2026-05-22 rebuild (tasks-p9l). This workflow runs entirely on
# GitHub-hosted runners and avoids that block.
#
# Required repo secrets:
#   - GITHUB_TOKEN (auto-provided) — used to push to ghcr.io
#   - HOMELAB_DEPLOY_TOKEN (PAT with `repo` scope on naren-m/homelab) —
#     enables the deploy step. If missing, build still succeeds; only the
#     homelab PR is skipped with a warning.
#
# After first successful run, the GHCR packages
#   - ghcr.io/naren-m/yoga-sutras
#   - ghcr.io/naren-m/yoga-sutras-frontend
# need to be flipped to Public visibility via the GitHub web UI
# (Settings → Packages → <name> → Change visibility) so the homelab
# cluster can pull them without an imagePullSecret. Same gotcha as
# ramayanam — see homelab-post-rebuild-drift memory item #9.

name: Test and Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        # Match ramayanam's tolerance pattern for upstream packaging issues:
        # filter git+ refs out of bulk install, then attempt each individually
        # with --no-deps so one bad pyproject can't sink the whole install.
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then
            grep -v -E '^\s*[a-zA-Z0-9_-]+\s*@\s*git\+' backend/requirements.txt > /tmp/req-pypi.txt || true
            grep -E '^\s*[a-zA-Z0-9_-]+\s*@\s*git\+'   backend/requirements.txt > /tmp/req-git.txt  || true
            pip install -r /tmp/req-pypi.txt || true
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              echo "Trying git dep (may fail, that's OK): $line"
              pip install --no-deps "$line" || echo "  -> skipped"
            done < /tmp/req-git.txt
          fi
          pip install pytest pytest-mock

      - name: Run backend tests
        # Same exit-code policy as ramayanam: real test failures (1/2/3) fail
        # the job; environment problems (4/5) warn but let the build proceed.
        run: |
          if [ ! -d backend/tests ]; then
            echo "::warning::No backend/tests directory; skipping pytest"
            exit 0
          fi
          set +e
          cd backend && pytest tests/ -v --tb=short --continue-on-collection-errors
          EXIT=$?
          set -e
          case "$EXIT" in
            0) echo "All backend tests passed." ;;
            4) echo "::warning::pytest exit 4: conftest could not be loaded. Build will proceed." ;;
            5) echo "::warning::pytest exit 5: no tests collected. Build will proceed." ;;
            *) echo "::error::pytest reported failures (exit $EXIT)"; exit $EXIT ;;
          esac

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image-tag: ${{ steps.tag.outputs.value }}
    env:
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        # Format matches the in-cluster pipeline: HHmmss-ddMmmyy-<shortsha>
        run: |
          SHORT_SHA=$(echo "$COMMIT_SHA" | cut -c1-7)
          TAG=$(date -u +"%H%M%S-%d%b%y")-${SHORT_SHA}
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
          echo "Image tag: $TAG"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/yoga-sutras:${{ steps.tag.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/yoga-sutras:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/yoga-sutras-frontend:${{ steps.tag.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/yoga-sutras-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: build-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      IMAGE_TAG: ${{ needs.build-and-publish.outputs.image-tag }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Check for deploy token
        id: check
        env:
          DEPLOY_TOKEN: ${{ secrets.HOMELAB_DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "::warning::HOMELAB_DEPLOY_TOKEN is not configured. Skipping homelab kustomization bump."
            echo "::warning::Add a PAT with 'repo' scope on naren-m/homelab as repo secret HOMELAB_DEPLOY_TOKEN to enable auto-deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout homelab repo
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: naren-m/homelab
          token: ${{ secrets.HOMELAB_DEPLOY_TOKEN }}
          path: homelab

      - name: Bump kustomization newTags + cut over to GHCR
        if: steps.check.outputs.skip != 'true'
        working-directory: homelab
        run: |
          set -eu
          FILE=base/applications/yoga-sutras/kustomization.yaml

          # Update newTag for both backend and frontend image stanzas. The
          # kustomization has two entries -- one per image -- with the same
          # newTag value; sed replaces all matches.
          sed -i 's|newTag: ".*"|newTag: "'"$IMAGE_TAG"'"|g' "$FILE"

          # Switch image source from local registry to GHCR. Idempotent:
          # only adds newName lines if they're not already present.
          if ! grep -q 'newName: ghcr.io/naren-m/yoga-sutras\b' "$FILE"; then
            sed -i 's|^\(  - name: 192\.168\.68\.138:5002/yoga-sutras\)$|\1\n    newName: ghcr.io/naren-m/yoga-sutras|' "$FILE"
          fi
          if ! grep -q 'newName: ghcr.io/naren-m/yoga-sutras-frontend' "$FILE"; then
            sed -i 's|^\(  - name: 192\.168\.68\.138:5002/yoga-sutras-frontend\)$|\1\n    newName: ghcr.io/naren-m/yoga-sutras-frontend|' "$FILE"
          fi

          git config user.email "yoga-sutras-ci@users.noreply.github.com"
          git config user.name "yoga-sutras CI"
          git add "$FILE"
          if git diff --cached --quiet; then
            echo "No kustomization change to commit."
            exit 0
          fi
          BRANCH="auto/yoga-sutras-${IMAGE_TAG}"
          git checkout -b "$BRANCH"
          MSG=$(printf '[ci skip] chore(yoga-sutras): bump newTag to %s\n\nBuilt and pushed by yoga-sutras GitHub Actions (test-and-publish.yml).\nImages:\n  ghcr.io/naren-m/yoga-sutras:%s\n  ghcr.io/naren-m/yoga-sutras-frontend:%s\nSource commit: %s\n' "$IMAGE_TAG" "$IMAGE_TAG" "$IMAGE_TAG" "$COMMIT_SHA")
          git commit -m "$MSG"
          git push origin "$BRANCH"

      - name: Open PR on homelab
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMELAB_DEPLOY_TOKEN }}
        working-directory: homelab
        run: |
          BRANCH="auto/yoga-sutras-${IMAGE_TAG}"
          gh pr create \
            --repo naren-m/homelab \
            --base main \
            --head "$BRANCH" \
            --title "[ci skip] chore(yoga-sutras): bump newTag to ${IMAGE_TAG}" \
            --body "Automated by yoga-sutras GitHub Actions. Built from ${COMMIT_SHA}." \
            || true
